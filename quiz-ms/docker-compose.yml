version: "3.8"

services:

  eureka-server:
    image: eureka-server
    ports:
      - "8761:8761"

  question-service:
    image: question-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server

  quiz-service:
    image: quiz-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - question-service

  api-gateway:
    image: api-gateway
    ports:
      - "9091:9091"
    depends_on:
      - eureka-server
      - quiz-service
      - question-service
