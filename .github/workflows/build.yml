name: Build Project

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up Java 17
    uses: actions/setup-java@v3
    with:
      distribution: temurin
      java-version: 17

  - name: Install Maven
    run: sudo apt-get update && sudo apt-get install -y maven

  - name: Build Eureka Server
    working-directory: eureka-server
    run: mvn clean install

  - name: Build Gateway Service
    working-directory: gateway-ms
    run: mvn clean install

  - name: Build Question Service
    working-directory: question-ms
    run: mvn clean install

  - name: Build Quiz Service
    working-directory: quiz-ms
    run: mvn clean install
