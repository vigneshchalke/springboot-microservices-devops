name: Build Project

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v3

  - name: Set up Java
    uses: actions/setup-java@v3
    with:
      distribution: temurin
      java-version: 17

  - name: Install Maven
    run: sudo apt-get update && sudo apt-get install -y maven

  - name: Build Project
    run: mvn clean install
