name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - run: sudo apt-get update
      - run: sudo apt-get install -y maven

      - name: Build Eureka
        run: mvn -f eureka-server/pom.xml clean install

      - name: Build Gateway
        run: mvn -f gateway-ms/pom.xml clean install

      - name: Build Question
        run: mvn -f question-ms/pom.xml clean install

      - name: Build Quiz
        run: mvn -f quiz-ms/pom.xml clean install
